name: CI with Log Forwarding

on:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Voice_based-_Tic-Tac-Toe repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Update system package cache
      - name: Update system package cache
        run: sudo apt-get update

      # Step 4: Install system dependencies (PortAudio only)
      # PortAudio must be installed BEFORE pip install (PyAudio requires portaudio19-dev)
      - name: Install system dependencies
        run: sudo apt-get install -y portaudio19-dev

      # Step 5: Install Python dependencies
      # Using python -m pip ensures packages install into selected Python 3.11 interpreter
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Step 6: Execute validation and forward logs to Log Pipeline
      # Invokes gh_run_with_logs.py with validate_app.py as the command
      # All GitHub Actions context is automatically passed via environment variables
      # GH_LOG_STRICT=0 enables best-effort forwarding:
      #   - If create_run() fails: CI job ALWAYS fails (hardcoded in run_with_forwarding)
      #   - If ingest_chunk() fails: best-effort continues validation, logs warning
      #   - If finalize() fails: best-effort logs warning, doesn't raise
      - name: Validate and forward logs
        env:
          GH_LOG_API_URL: ${{ secrets.LOG_API_URL }}
          GH_LOG_API_KEY: ${{ secrets.LOG_API_KEY }}
          GH_LOG_STRICT: "0"
        run: |
          python scripts/gh_run_with_logs.py \
            --step-name "Voice TTT Validation" \
            --stage validation \
            python scripts/validate_app.py
